training_reproduction:
  native_training_parity: false
  known_differences:
    - >-
      The native trainer does not reproduce the external dream_lr optimizer
      group, max_steps microbatch accounting, or the Accelerate/DeepSpeed LR
      scheduler trajectory.
    - >-
      The external max_grad_norm and project.seed semantics are not wired into
      the native trainer, and training_strategy fields use a different schema.

known_gaps:
  - >-
    The openwam training worktree was not committed and the checkpoint contains
    no source metadata, so the exact July 4 training source cannot be reconstructed.
  - >-
    The fixed-seed GPU differential proves current-tree inference parity for
    two recorded chunks, not parity with the unavailable July training binary.
  - >-
    The run directory is not portable or self-contained: construction still
    depends on the absolute /DATA SANA bundle, Wan VAE, and Gemma assets.
  - >-
    The July implementation itself has a window-graft train/deploy mismatch:
    training attends within four-frame temporal windows, while deploy sees one
    two-frame chunk and the graft degenerates to per-frame spatial attention.
