[project]
name = "sana-wam"
version = "0.1.0"
description = "SANA block-autoregressive (diffusion-forcing) world-action model — standalone."
requires-python = ">=3.12,<3.13"
dependencies = [
    # core
    "torch==2.7.1",
    "torchvision",
    "numpy>=1.24,<3",
    "einops>=0.7,<1",
    "safetensors>=0.4,<1",
    "omegaconf>=2.3,<3",
    "PyYAML>=6,<7",
    "tqdm>=4.66,<5",
    # data
    "h5py>=3.8,<4",
    "Pillow>=10,<13",
    "opencv-python>=4.7,<5",
    "scipy>=1.10,<2",
    "imageio[ffmpeg]>=2.28,<3",
    "av>=12",
    "ftfy>=6.1,<7",
    "regex",
    # SANA upstream (diffusion.* package on third_party/Sana sys.path)
    "transformers>=5.5,<6",
    "diffusers>=0.30",
    "timm",
    "mmcv-lite",
    "mmengine",
    # GDN (gated delta net) attention — sana_wm video backbone. ShortConvolution
    # + fused linear-attn kernels. Triton kernels need Ampere+; CPU import works.
    # triton is NOT pinned here (torch 2.7.1 hard-pins triton==3.3.1, which fails
    # to COMPILE the GDN kernels); it is overridden to 3.5.1 via [tool.uv]
    # override-dependencies below. The scripts set GDN_DISABLE_COMPILE=1 to skip
    # torch.compile (torch 2.7.1 inductor <-> triton 3.5.1 ABI break on triton_key).
    "flash-linear-attention>=0.4.2,<0.6",
    "sentencepiece>=0.1.99,<1",
    "protobuf>=4.25,<7",
    # deploy server
    "aiohttp>=3.9,<4",
    "websockets>=11",
    "pytz>=2026.2",
    "qwen-vl-utils>=0.0.14",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.14"]
dev = ["pytest>=8,<10", "ruff>=0.4,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sana_wam"]

[tool.uv]
# torch is pinned to 2.7.1 (+cu128 on the H200 box); install via the explicit
# PyTorch CUDA index below to match the SANA weight-load / flash-attn ABI.
#
# torch 2.7.1 hard-pins triton==3.3.1, but the GDN (sana_wm) Triton kernels only
# compile on triton 3.5.1. Override the constraint so the resolver installs
# 3.5.1 instead of torch's bundled 3.3.1. Safe: torch's eager + GDN's bare
# @triton.jit kernels work on 3.5.1; the only break (inductor's triton_key) is
# sidestepped by GDN_DISABLE_COMPILE=1 in scripts/train.py + deploy.py.
override-dependencies = ["triton==3.5.1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires GPU",
    "data: test requires RoboTwin data",
]
