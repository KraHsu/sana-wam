# sana-wam training config — GDN video backbone + cross-attention action bridge.
# TI2V world-action model: the real first frame (current observation) conditions
# the generated video (clean-prefix at t=0), and the action stream cross-attends
# to the GDN video features. GPU/Triton-only (ChunkCausalGDNTriton needs CUDA +
# triton 3.5.1; the trainer sets GDN_DISABLE_COMPILE=1 automatically).
#
#   python scripts/train.py --config configs/train_gdn_cross.yaml \
#       dataloader.dataset_dir=/DATA/share/RoboTwin2.0/dataset \
#       dataloader.train_tasks=[adjust_bottle,lift_pot]

model:
  architecture:
    framework: dual_system
    variant: joint_cross_attn        # → DualSystemCrossAttnArchitecture
    action_dim: 20
    use_proprioception: true
    state_dim: 20
    # Cross-attn bridges: one action block per video DiT layer it reads. null +
    # bridge_interval=1 → every video layer bridges (resolve_bridge_layers).
    bridge_layers: null
    bridge_interval: 1
    # Action-side attention geometry (independent of the GDN video head_dim=112).
    dim: 1152
    num_heads: 16
    # Clean ACTION prefix (Design B): condition the action stream on the executed-past
    # actions. Action tokens [0, k) (the actions up to the current frame) are pinned
    # clean (sigma=0) and dropped from the loss — mirroring the video TI2V clean prefix
    # — so the model learns to predict future actions from the real past ones. k is the
    # same boundary as the proprio/video prefix (num_clean_prefix_actions from the
    # growing-history dataloader). At deploy the streaming engine pins the robot's
    # executed actions there. Requires growing_history.
    action_clean_prefix: true
    # Teacher-forcing robustness: with this prob drop the action prefix per sample
    # (train without it) so the model stays robust to missing/imperfect history and
    # the episode-0 bootstrap, narrowing the train↔deploy (executed-action) gap.
    action_prefix_dropout: 0.3

  video_backbone:
    name: sana_video_2b
    # GDN trains from scratch — the linear_relu 480p checkpoint is incompatible,
    # so NO model_path (random init). Supply a GDN checkpoint later via
    # architecture.load_checkpoint if pretraining a GDN video model separately.
    model_path: null
    # The Wan VAE is still needed to encode video pixels → latents. It is
    # independent of the DiT weights, so point at the bundle's VAE explicitly
    # (model_path=null means no bundle auto-discovery).
    vae_path: /DATA/share/SANA-Video_2B_480p/vae/Wan2.1_VAE.pth
    text_encoder_name: /DATA/share/gemma-2-2b-it
    freeze: false
    attn_kernel: gdn                 # → SanaMSVideoCamCtrl + ChunkCausalGDNTriton
    chunk_size: 3                    # GDN chunk-causal frames/chunk
    fp32_attention: true             # upstream sana_wm runs GDN in fp32
    # TI2V: condition on the real first frame (clean-prefix at t=0). This is the
    # whole point of a world-action model — predict from the actual observation.
    use_first_frame_cond: true
    flow_shift: 3.0

  action_backbone:
    dim: 1152
    ffn_dim: 4608
    # Cross-attn variant does not use attn_kernel coupling (no MoT driver).

dataloader:
  type: robotwin
  dataset_dir: /DATA/share/RoboTwin2.0/dataset
  task_name: null
  robot: aloha-agilex
  variant: clean_50
  action_mode: eef
  # Cross-attn / GDN has no ar_frame_chunk_size divisibility constraint; keep the
  # same pixel cadence as the AR config (49 raw → 13 video frames, stride 4).
  num_frames: 49
  video_stride: 4
  height: 384
  width: 320
  split: train
  val_ratio: 0.0
  repeat: 1
  window_stride: 1
  multiview: true
  camera_layout: [head_camera, left_camera, right_camera]
  target_camera: head_camera
  normalize_mode: min-max
  filter_static_segments: true
  static_segment_threshold: 1.0e-5
  max_static_retry: 3
  train_tasks: null
  holdout_tasks: null
  val_variant: null
  text_embedding_cache_dir: null
  text_embedding_dropout: 0.0
  vae_cache_dir: null
  # ---- Growing-history (variable-length, anchored at episode frame 0) ----
  # Every window starts at frame 0 and sweeps a variable history length k; the
  # raw buffer auto-expands to span the longest episode (pad-to-max-T) so batches
  # still stack. Each sample gets a chunk-aligned clean-prefix of real observed
  # latent frames (sigma=0, unsupervised) — the model learns to predict under any
  # amount of history, matching the streaming deploy engine.
  growing_history: true
  history_min_frames: 5     # shortest logical window (raw frames)
  history_stride: 4         # step between logical window lengths
  # MUST mirror model.video_backbone.chunk_size (GDN latent chunk). The clean
  # prefix is sampled on multiples of this so the predicted region is whole chunks.
  gdn_chunk_size: 3

training:
  output_dir: outputs/gdn_cross
  max_steps: 1995
  save_steps: 500
  keep_last_k: 2
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 4
  video_lr: 1.0e-4          # GDN trains from scratch → higher than the AR finetune LR
  action_lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 50
  lambda_video: 1.0
  lambda_action: 1.0
  use_gradient_checkpointing: true
  freeze: [video_backbone._pipe.vae]
  deepspeed: null
  seed: 0
  debug: false

