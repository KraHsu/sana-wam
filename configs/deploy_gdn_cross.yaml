# ---------------------------------------------------------------------------
# Deploy settings for the GDN cross-attention TI2V world-action model
# (dual_system / joint_cross_attn).
#
# build_engine dispatches DualSystemCrossAttnArchitecture →
# CrossAttnInferenceEngine (src/sana_wam/deploy/cross_attn_engine.py). In the
# default STREAMING mode the engine rebuilds the observed-history clip from
# WAMPolicy's obs_history each step — anchored at episode frame 0, subsampled at
# the training video_stride — and VAE-encodes it, so the clean-prefix latents are
# real causal latents carrying motion (matching growing-history training), not a
# stack of single-image encodes. The greedy/no-async constraints still apply:
# each generate must ingest exactly one new realized observation per step, so
# receding-horizon re-generation would advance the history more than once per
# realized frame, and temporal ensembling mixes incompatible history lengths.
# ---------------------------------------------------------------------------
checkpoint_path: null          # --ckpt-dir on the CLI overrides this.
device: cuda:0
server:
  host: "0.0.0.0"
  ws_port: 8850
  http_port: 8848

# ---------------------------------------------------------------------------
# Inference parameters (cfg.inference; read by CrossAttnInferenceEngine).
# num_frames / video_num_frames / height / width are auto-filled from the
# checkpoint dataloader when omitted (build_server_from_config). action_tokens=0
# ⇒ inferred from the clip (raw_num_frames - 1).
# ---------------------------------------------------------------------------
inference:
  video_steps: 4              # flow-matching steps for the predicted video clip
  action_steps: 4             # flow-matching steps for the predicted action clip
  action_tokens: 0            # 0 ⇒ infer from clip (num_frames - 1)
  seed: 0
  streaming: true             # rebuild+re-encode observed history each step
  predict_horizon_frames: 1   # latent frames to leave for prediction each step

# ---------------------------------------------------------------------------
# Policy execution. The cross-attn model is ONE-SHOT (each generate predicts the
# whole remaining trajectory), and the engine returns only the FUTURE actions
# (anchored at "now"). Under greedy (execute_horizon=null) the policy would drain
# that whole future before re-observing → effectively open-loop. So streaming needs
# a FINITE execute_horizon: execute a few actions, then re-observe (which grows the
# clean prefix by ~one latent frame) and re-generate. Set it to ~tc*video_stride
# (= raw steps per latent frame; 4*4=16 by default) so re-observation advances the
# prefix one latent at a time, matching the growing-history training increment.
# Tune against RoboTwin. temporal_ensemble/async stay off: they mix predictions
# made under different history lengths, which this model is not trained for.
# ---------------------------------------------------------------------------
policy:
  execute_horizon: 16         # raw action steps per re-observation (~one latent frame); tune on RoboTwin
  temporal_ensemble: false    # MUST be false: mixes incompatible history lengths
  # REQUIRED for streaming: obs_history must reach back to episode frame 0 so the
  # engine can rebuild the frame-0-anchored clip at the training pixel cadence.
  # Set history_len >= the checkpoint's dataloader.num_frames (= the growing-history
  # raw_window_len, which spans the LONGEST training episode). If it is smaller, the
  # frame-0 anchor cannot represent "now": the engine logs a warning and clamps to a
  # leading window (out-of-distribution). 64 suits short episodes — bump it to match
  # your data's longest episode.
  history_len: 64

# ---------------------------------------------------------------------------
# Deploy-time optimizations.
# ---------------------------------------------------------------------------
optimization:
  decode_video: false         # action-only at deploy; do not decode video
  async_inference:
    mode: none                # MUST stay none: one realized obs must map to one step
  prompt_embed_cache:
    maxsize: 32
