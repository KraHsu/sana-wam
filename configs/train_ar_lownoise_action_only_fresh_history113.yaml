# Fresh treatment pilot: exact C1 architecture and optimizer contract, mixing
# clean_50 with immutable live-scene history113 expert corrections. Only the
# action backbone is trainable; SANA and every other module remain frozen.

model:
  architecture:
    framework: dual_system
    variant: autoregressive
    action_dim: 20
    use_proprioception: true
    state_dim: 20
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: joint
    video_attention_mask_mode: first_frame_causal
    ar_frame_chunk_size: 2
    ar_attn_window: 72
    ar_noisy_cond_prob: 0.5
    ar_cond_max_ratio: 0.3
    proprio_per_chunk: true
    ar_bootstrap_clean_prefix: true
    proprio_action_dropout_prob: 0.3
    action_loss_weighting: low_noise
    joint_graft: false
    joint_graft_idx: null
    joint_graft_every_n: 0
  video_backbone:
    name: sana_video_2b
    model_path: /DATA/share/SANA-Video_2B_480p
    freeze: false
    attn_kernel: linear_relu
    text_encoder_name: /DATA/share/gemma-2-2b-it
    model_kwargs:
      additional_flash_attn: window_flash
      flash_attn_window_count: [1, 1, 4]
      linear_feature_map: learnable
  action_backbone:
    dim: 1152
    ffn_dim: 4608
    attn_kernel: linear_relu

dataloader:
  type: mixture
  seed: 42
  weight_strategy: manual
  action_dim_override: null

  task_name: adjust_bottle
  robot: aloha-agilex
  action_mode: eef
  num_frames: 113
  video_stride: 4
  height: 384
  width: 320
  multiview: true
  camera_layout: [head_camera, left_camera, right_camera]
  target_camera: head_camera
  normalize_mode: min-max
  temporal_compression: 4
  causal_temporal: true
  delta_action: false

  datasets:
    - type: robotwin
      enabled: true
      weight: 1.0
      dataset_dir: /DATA/share/RoboTwin2.0/dataset
      task_name: adjust_bottle
      robot: aloha-agilex
      variant: clean_50
      action_mode: eef
      num_frames: 113
      video_stride: 4
      height: 384
      width: 320
      split: train
      val_ratio: 0.05
      repeat: 1
      window_stride: 1
      multiview: true
      camera_layout: [head_camera, left_camera, right_camera]
      target_camera: head_camera
      normalize_mode: min-max
      action_stats_path: /home/zch/wuji-openwam-dev/sandbox/sana_ar_graft_AC_lownoise_only/2026-07-04_13-03-25/action_stats.npy
      filter_static_segments: true
      static_segment_threshold: 1.0e-5
      max_static_retry: 3
      train_tasks: null
      holdout_tasks: null
      val_variant: null
      text_embedding_cache_dir: null
      text_embedding_dropout: 0.0
      temporal_compression: 4
      causal_temporal: true
      delta_action: false

    - type: robotwin_history_dagger
      enabled: true
      weight: 0.5
      source_manifest_path: /home/zch/workspace/sana-wam/logs/fresh_dagger_takeover_n5_20260717/dataset/dataset_manifest.json
      source_manifest_sha256: 30e8996370924f1f5c4b519e5a2b0ace892fdf68289131f53a76f1a3cf7ab1f6
      action_stats_path: /home/zch/wuji-openwam-dev/sandbox/sana_ar_graft_AC_lownoise_only/2026-07-04_13-03-25/action_stats.npy
      action_stats_sha256: 2404b012a04f4e7d09e72fdfdddb4288099866a32f5e42e127cf4b5613df5cfc
      expected_policy_history_len: 113
      action_mode: eef
      normalize_mode: min-max
      num_frames: 113
      video_stride: 4
      temporal_compression: 4
      causal_temporal: true
      height: 384
      width: 320
      multiview: true
      camera_layout: [head_camera, left_camera, right_camera]
      target_camera: head_camera
      filter_static_segments: false
      delta_action: false
      repeat: 1
      split: train
      val_ratio: 0.0
