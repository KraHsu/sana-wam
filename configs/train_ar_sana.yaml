# sana-wam training config — SANA block-autoregressive (dual_system / autoregressive).
# Single merged file (no Hydra defaults composition): model + dataloader + training.
# CLI overrides via OmegaConf dotlist, e.g.:
#   python scripts/train.py --config configs/train_ar_sana.yaml \
#       model.video_backbone.model_path=/DATA/share/SANA-Video_2B_480p \
#       dataloader.dataset_dir=/DATA/share/RoboTwin2.0/dataset \
#       dataloader.train_tasks=[adjust_bottle,lift_pot] training.max_steps=1995

model:
  architecture:
    framework: dual_system
    variant: autoregressive
    action_dim: 20
    use_proprioception: true
    state_dim: 20
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: joint
    video_attention_mask_mode: first_frame_causal
    # --- AR (LingBot-VA RoboTwin defaults) ---
    ar_frame_chunk_size: 2
    ar_attn_window: 72
    ar_noisy_cond_prob: 0.5
    ar_cond_max_ratio: 0.3
    # F4 per-chunk proprio (additive zero-init AdaLN delta) + F3 chunk-0 bootstrap.
    proprio_per_chunk: true
    ar_bootstrap_clean_prefix: true
    # Training only: independently hide proprio from the action branch while
    # retaining it in the video/world-model branch. 0 preserves prior behavior.
    proprio_action_dropout_prob: 0.0
    # none preserves the historical AR loss; low_noise is the canonical
    # min-SNR-style recipe that emphasizes near-clean action timesteps.
    action_loss_weighting: none

  video_backbone:
    name: sana_video_2b
    model_path: /DATA/share/SANA-Video_2B_480p
    text_encoder_name: /DATA/share/gemma-2-2b-it
    freeze: false
    attn_kernel: linear_relu
    # Conventions mirrored from upstream Sana-wm (../Sana/configs/sana_wm/*.yaml).
    # qk_norm is always on in the fork (hardcoded True in pipeline_builder), matching
    # upstream `qk_norm: true`. flow_shift stays 3.0 here: that is the value for the
    # SANA-Video 2B *480p* checkpoint (model_wrapper.py:17); upstream sana_wm's 9.95
    # is for the retrained 720p model and would be wrong for this base.
    flow_shift: 3.0
    # fp32_attention: run linear-attn matmuls in fp32 (upstream `fp32_attention: true`).
    # Off by default (bf16, byte-identical to prior fork behavior); enable for NaN-loss
    # robustness at the cost of speed.
    fp32_attention: false

  action_backbone:
    dim: 1152
    ffn_dim: 4608
    attn_kernel: linear_relu

dataloader:
  type: robotwin
  dataset_dir: /DATA/share/RoboTwin2.0/dataset
  task_name: null
  robot: aloha-agilex
  variant: clean_50
  action_mode: eef
  # AR requires latent T divisible by ar_frame_chunk_size=2: num_frames=49 →
  # 13 video frames (stride 4) → causal-VAE latent T=4. (Default 33 → T=3 breaks AR.)
  num_frames: 49
  video_stride: 4
  height: 384
  width: 320
  split: train
  val_ratio: 0.0
  repeat: 1
  window_stride: 1
  multiview: true
  camera_layout: [head_camera, left_camera, right_camera]
  target_camera: head_camera
  normalize_mode: min-max
  filter_static_segments: true
  static_segment_threshold: 1.0e-5
  max_static_retry: 3
  train_tasks: null
  holdout_tasks: null
  val_variant: null
  text_embedding_cache_dir: null
  text_embedding_dropout: 0.0
  # Opt-in VAE latent cache (upstream Sana-wm load_vae_feat analogue): precompute
  # with scripts/precompute_vae_latents.py, then point here to skip the per-step
  # VAE encode. Misses fall back to live encoding. null = always encode live.
  vae_cache_dir: null

training:
  output_dir: outputs/ar_sana
  max_steps: 1995
  save_steps: 500
  keep_last_k: 2
  batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 4
  # optimizer
  video_lr: 1.0e-5
  action_lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 50
  lambda_video: 1.0
  lambda_action: 1.0
  use_gradient_checkpointing: true
  # freeze: modules (dotted paths under the architecture) kept in eval/no-grad.
  freeze: [video_backbone._pipe.vae]
  deepspeed: null        # null | zero2 | zero3  (requires the `deepspeed` extra)
  seed: 0
  debug: false
