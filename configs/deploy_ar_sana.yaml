# ---------------------------------------------------------------------------
# Deploy settings for the block-autoregressive SANA WAM (dual_system / autoregressive).
#
# scripts/deploy.py and policy_server.build_server_from_config dispatch to
# the AR inference engine for this architecture (see sana_wam/deploy/ar_engine.py).
# The engine is STATEFUL closed-loop: one AR step per generate(), persistent
# KV cache across steps. That imposes two hard requirements below — greedy
# policy mode and async disabled — see sana_wam/deploy/ar_engine.py.
# ---------------------------------------------------------------------------
checkpoint_path: null          # --ckpt-dir on the CLI overrides this.
device: cuda:0
server:
  host: "0.0.0.0"
  ws_port: 8850
  http_port: 8848

# ---------------------------------------------------------------------------
# Inference parameters (populate cfg.inference; read by ARInferenceEngine).
# num_frames / video_num_frames / height / width are auto-filled from the
# checkpoint dataloader when omitted (policy_server.build_server_from_config /
# scripts/deploy.py); the engine also recomputes them defensively.
# ---------------------------------------------------------------------------
inference:
  video_steps: 4              # retained for compatibility; closed-loop uses observed video
  action_steps: 20            # full-noise action denoising validation
  # null matches training's ambient noise; set an int only for deterministic debugging.
  seed: null
  # Canonical-compatible default. ``paired`` derives a distinct stable RNG seed
  # from each named /reset while matching that seed across A/B arms.
  episode_noise_mode: ambient       # ambient | paired
  episode_noise_base_seed: 0
  shift: 5.0

  # --- AR deploy-semantics knobs (eval-verification targets; handoff §2c) ---
  ar_obs_chunk_mode: rolling_buffer   # rolling_buffer (default) | repeat_frame (debug)
  ar_obs_latent_band: auto            # auto (leading@step0, trailing after — training-matched) | leading | trailing
  # per_step (default): each chunk's per-chunk AdaLN proprio delta = current measured
  #   state — in-distribution with proprio_per_chunk training. single: latch the
  #   episode's first state for ALL chunks (off-distribution for the per-chunk deltas;
  #   only matches the clip-level context token — debug/ablation only).
  ar_proprio_mode: per_step
  # Use model-predicted confirmed action cache by default. ``measured`` replaces
  # the previous action frame with the achieved proprio trajectory at next chunk.
  cache_feedback_mode: predicted    # predicted | measured
  cache_feedback_fallback: predicted  # predicted | error
  # ar_action_tokens_per_chunk: 24    # optional override; else derived from num_frames / num_chunks

# ---------------------------------------------------------------------------
# Policy execution — GREEDY IS MANDATORY for the AR engine.
# Each generate() ingests exactly one realized obs and advances the cache by one
# chunk; receding-horizon / temporal-ensembling / async would double-advance or
# reorder the cache and break AR frame alignment.
# ---------------------------------------------------------------------------
policy:
  execute_horizon: null       # null => greedy: drain the full chunk, then re-generate
  temporal_ensemble: false    # MUST be false for AR
  # obs_history must hold a full raw frame window (>= dataloader.num_frames) so the
  # engine can rebuild the obs clip at the training pixel cadence (video_stride).
  history_len: 64

# ---------------------------------------------------------------------------
# Deploy-time optimizations.
# ---------------------------------------------------------------------------
optimization:
  decode_video: false         # action-only; the AR engine does not decode video at deploy
  async_inference:
    mode: none                # MUST stay none for AR
  prompt_embed_cache:
    maxsize: 32

telemetry:
  enabled: false
  output_dir: ./telemetry/server
  include_chunks: true
  flush_every: 32
