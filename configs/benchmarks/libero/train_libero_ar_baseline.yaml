# LIBERO-native AR baseline training template.
#
# This file is a source/config contract, not training authority. Before use,
# materialize action_stats_path with scripts/build_libero_stats.py and pin its
# SHA256 in training.action_stats_sha256. The current CACH-A4 reduced path has a
# strong-stop result; this deployable AR baseline isolates the benchmark/data
# integration and is not presented as the final CACH architecture.

model:
  architecture:
    framework: dual_system
    variant: autoregressive
    action_dim: 7
    use_proprioception: true
    state_dim: 8
    delta_action: false
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: joint
    video_attention_mask_mode: first_frame_causal
    ar_frame_chunk_size: 2
    ar_attn_window: 72
    ar_noisy_cond_prob: 0.5
    ar_cond_max_ratio: 0.3
    proprio_per_chunk: true
    ar_bootstrap_clean_prefix: true
    proprio_action_dropout_prob: 0.0
    action_loss_weighting: low_noise
    joint_graft: false
    joint_graft_idx: null
    joint_graft_every_n: 0
  video_backbone:
    name: sana_video_2b
    model_path: /DATA/share/SANA-Video_2B_480p
    freeze: false
    attn_kernel: linear_relu
    text_encoder_name: /DATA/share/gemma-2-2b-it
    model_kwargs:
      additional_flash_attn: window_flash
      flash_attn_window_count: [1, 1, 4]
      linear_feature_map: learnable
  action_backbone:
    dim: 1152
    ffn_dim: 4608
    attn_kernel: linear_relu

dataloader:
  type: libero
  dataset_roots:
    - /DATA/share/LIBERO/libero/libero_spatial_no_noops_1.0.0_lerobot
    - /DATA/share/LIBERO/libero/libero_object_no_noops_1.0.0_lerobot
    - /DATA/share/LIBERO/libero/libero_goal_no_noops_1.0.0_lerobot
    - /DATA/share/LIBERO/libero/libero_10_no_noops_1.0.0_lerobot
  action_stats_path: /DATA/share/LIBERO/sana_wam_libero_all_minmax_stats.npy
  action_mode: libero_relative_eef
  state_mode: libero_eef_axis_angle_gripper
  normalize_mode: min-max
  state_normalize_mode: min-max
  num_frames: 113
  video_stride: 4
  temporal_compression: 4
  causal_temporal: true
  window_stride: 4
  height: 384
  width: 320
  split: train
  val_ratio: 0.0
  repeat: 1
  seed: 20260806
  multiview: true
  camera_layout: [head_camera, left_wrist_camera, right_wrist_camera]
  target_camera: head_camera
  training_video_rotation_degrees: 0
  delta_action: false
  filter_static_segments: false
  verify_stats_source: true
  verify_known_repairs: true
  excluded_episodes:
    - libero_goal_no_noops_1.0.0_lerobot:82
  benchmark_contract:
    schema_version: sana-wam-libero-policy-v1
    benchmark: libero
    dataloader_type: libero
    action_mode: libero_relative_eef
    state_mode: libero_eef_axis_angle_gripper
    normalize_required: true
    state_dim: 8
    state_layout:
      - eef_x
      - eef_y
      - eef_z
      - eef_axis_angle_x
      - eef_axis_angle_y
      - eef_axis_angle_z
      - gripper_qpos_0
      - gripper_qpos_1
    action_dim: 7
    action_layout:
      - delta_x
      - delta_y
      - delta_z
      - delta_axis_angle_x
      - delta_axis_angle_y
      - delta_axis_angle_z
      - open_gripper
    action_representation: relative_delta_pose
    action_output_space: denormalized_checkpoint_units
    normalization:
      action:
        active: true
        mode: min-max
        stats_key: libero_relative_eef
        dim: 7
      state:
        active: true
        mode: min-max
        stats_key: libero_eef_axis_angle_gripper
        dim: 8
    gripper:
      model_open: 1.0
      model_closed: 0.0
      threshold: 0.5
      env_open: -1.0
      env_closed: 1.0
    multiview: true
    camera_layout: [head_camera, left_wrist_camera, right_wrist_camera]
    camera_mapping:
      agentview_image: head_camera
      robot0_eye_in_hand_image: left_wrist_camera
      missing: right_wrist_camera
    missing_right_camera_fill: black
    training_video_rotation_degrees: 0
    simulator_video_rotation_degrees: 180
    training_dataset_names:
      - libero_spatial_no_noops_1.0.0_lerobot
      - libero_object_no_noops_1.0.0_lerobot
      - libero_goal_no_noops_1.0.0_lerobot
      - libero_10_no_noops_1.0.0_lerobot
    excluded_training_episodes:
      - libero_goal_no_noops_1.0.0_lerobot:82

training:
  # Source template only; no run has been authorized or started.
  output_dir: /DATA/share/sana_wam_libero_training/UNAUTHORIZED_TEMPLATE
  max_steps: 2000
  save_steps: 500
  keep_last_k: 2
  batch_size: 1
  gradient_accumulation_steps: 8
  num_workers: 4
  trainable_modules:
    - action_backbone
    - proprio_encoder
    - proprio_video_embed
    - proprio_action_embed
  # Trainer groups non-action top-level conditioning modules under video_lr;
  # the video backbone itself is outside the allowlist and remains frozen.
  video_lr: 1.0e-4
  action_lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 100
  lambda_video: 0.0
  lambda_action: 1.0
  use_gradient_checkpointing: true
  deepspeed: null
  seed: 20260806
  debug: false
  # Must be filled with the generated stats SHA before any training authority.
  action_stats_sha256: null
